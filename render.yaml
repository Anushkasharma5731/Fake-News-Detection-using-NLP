services:
  - type: web
    name: signal-check
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python train_model.py
    startCommand: gunicorn --workers 1 --threads 4 --timeout 30 --max-requests 1000 --max-requests-jitter 100 --access-logfile - --error-logfile - app:app
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
